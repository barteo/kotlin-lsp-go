name: PR checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# An explicit shell runs steps with -eo pipefail, so `go test | tee` fails
# when go test does.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The Kotlin standard library the tests analyze against: kc's
  # KOTLIN_VERSION (kotlin-compiler-go's pr-checks.yml).
  KOTLIN_VERSION: 2.4.21
  KOTLIN_SHA256: 7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  lint:
    name: Format, vet and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "::error::These files need gofmt -w:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install kotlinc ${{ env.KOTLIN_VERSION }}
        run: |
          zip=kotlin-compiler-$KOTLIN_VERSION.zip
          curl -sSfLo "$RUNNER_TEMP/$zip" \
            "https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION/$zip"
          echo "$KOTLIN_SHA256  $RUNNER_TEMP/$zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP"
          echo "KOTLIN_HOME=$RUNNER_TEMP/kotlinc" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      - name: go test
        run: go test -race -v ./... 2>&1 | tee "$RUNNER_TEMP/test.log"

      # The tests skip themselves without a JDK or the standard library, so
      # a broken setup would otherwise pass while running almost nothing.
      - name: Check that no test skipped for a missing tool
        if: ${{ !cancelled() }}
        run: |
          pattern='^ +[A-Za-z0-9_]+_test\.go:[0-9]+: (no JDK|no kotlin-stdlib\.jar.*)$'
          skipped=$(grep -E "$pattern" "$RUNNER_TEMP/test.log" | sed -E 's/^ +//' | sort | uniq -c || true)
          if [ -n "$skipped" ]; then
            echo "::error::Tests skipped because a tool is missing from the runner:"
            echo "$skipped"
            exit 1
          fi

  # The VS Code extension (editors/vscode): it compiles, its TextMate
  # grammar tokenizes a sample as VS Code does, and it packages with the
  # server and kc built for the runner.
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Compile and test
        run: npm test

      - name: Package
        run: |
          mkdir -p server
          go build -o server/kcls ../../cmd/kcls
          go build -o server/kc github.com/barteo/kotlin-compiler-go/cmd/kc
          npm run package
